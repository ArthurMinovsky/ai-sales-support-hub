name: CI · Tests, Docker and Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package and tests
        run: python -m pip install -e './backend[test]'
      - name: Backend unit tests
        run: |
          mkdir -p evidence/backend
          cd backend
          pytest -q --junitxml=../evidence/backend/pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: evidence/backend/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: cd web && npm ci --no-audit --no-fund
      - name: Type check
        run: cd web && npm run typecheck
      - name: Frontend build
        run: cd web && npm run build
  integration:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: saleshub-reset-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure isolated demo secrets
        run: |
          # checkov:skip=CKV_SECRET_6: CI JWT is generated at runtime; no hardcoded credential exists
          printf 'JWT_SECRET=%s\nAPP_ORIGIN=\n' "$(openssl rand -hex 32)" > .env
      - name: Boot Compose with mocked external OpenRouter ONLY
        run: docker compose -f compose.yaml -f compose.e2e.yaml -p saleshub-reset-ci up --build --force-recreate -d --wait --wait-timeout 180
      - name: Discover Docker allocated host ports
        run: |
          web_port="$(docker compose port --index 1 web 3000 | sed -n '1s/.*://p')"
          api_port="$(docker compose port --index 1 api 8000 | sed -n '1s/.*://p')"
          test -n "$web_port" && test -n "$api_port"
          printf 'PLAYWRIGHT_BASE_URL=http://localhost:%s\nAPI_BASE_URL=http://localhost:%s\n' "$web_port" "$api_port" >> "$GITHUB_ENV"
      - name: Wait for API and Web
        run: |
          for i in $(seq 1 45); do
            if curl -fsS "$API_BASE_URL/health" && curl -fsS "$PLAYWRIGHT_BASE_URL/login" >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose -f compose.yaml -f compose.e2e.yaml -p saleshub-reset-ci logs
          exit 1
      - name: Install Playwright
        run: cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Playwright browser E2E
        run: cd web && npm run test:e2e
      - name: API restart, recreation and stale-session isolation
        run: python3 tests/verification/check_reset.py --project saleshub-reset-ci --output evidence/docker/reset.json
      - name: Container cleanup
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml -p saleshub-reset-ci down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-e2e-evidence
          path: |
            evidence/frontend/
            web/test-results/
            evidence/docker/reset.json
  sca_sast_iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit tooling
        run: |
          # Backend and pip-audit coexist in the main environment (pinned trees are compatible).
          python -m pip install -e './backend[test]' pip-audit
          # semgrep's pinned mcp dependency conflicts with the backend's fastapi/starlette
          # tree in a single joint resolution, so the scanners get their own venv.
          python -m venv /tmp/scan-tools
          /tmp/scan-tools/bin/pip install semgrep checkov
          cd web && npm ci --no-audit --no-fund
      - name: Run SCA, SAST and IaC (retain findings, no false PASS)
        id: security
        shell: bash
        run: |
          SECURITY_EVIDENCE_DIR="$PWD/evidence/security" \
          SECURITY_CATEGORIES=sca,sast,iac \
          PATH="/tmp/scan-tools/bin:$PATH" bash scripts/security/run-scans.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-static-evidence
          path: evidence/security/
  dast:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: saleshub-dast
    steps:
      - uses: actions/checkout@v4
      - name: Configure demo session secret
        run: |
          # checkov:skip=CKV_SECRET_6: CI JWT is generated at runtime; no hardcoded credential exists
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
      - name: Boot healthy live app for ZAP
        run: docker compose -p saleshub-dast up --build -d
      - name: Discover Docker allocated host ports
        run: |
          web_port="$(docker compose port --index 1 web 3000 | sed -n '1s/.*://p')"
          api_port="$(docker compose port --index 1 api 8000 | sed -n '1s/.*://p')"
          test -n "$web_port" && test -n "$api_port"
          printf 'DAST_TARGET=http://localhost:%s\nAPI_BASE_URL=http://localhost:%s\n' "$web_port" "$api_port" >> "$GITHUB_ENV"
      - name: Verify app readiness
        run: |
          for i in $(seq 1 45); do
            if curl -fsS "$API_BASE_URL/health" && curl -fsS "$DAST_TARGET/login" >/dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: ZAP Baseline DAST (unauthenticated passive scope)
        run: |
          bash scripts/security/run-zap.sh "$PWD/evidence/security/dast" "$DAST_TARGET" host
          python3 scripts/security/triage.py --evidence-dir "$PWD/evidence/security" --categories dast
      - name: Save scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-dast-evidence
          path: evidence/security/dast/
      - name: Teardown only CI-owned stack; preserve reports
        if: always()
        run: docker compose -p saleshub-dast down
  release_image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration, sca_sast_iac, dast]
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible app images
        run: |
          docker build -t saleshub-api:${{ github.sha }} backend
          docker build -t saleshub-web:${{ github.sha }} web
          mkdir -p evidence/release
          docker save saleshub-api:${{ github.sha }} saleshub-web:${{ github.sha }} -o evidence/release/ai-sales-hub-images.tar
          sha256sum evidence/release/ai-sales-hub-images.tar > evidence/release/image-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: docker-release-images
          path: evidence/release/
