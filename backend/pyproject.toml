[project]
name = "ai-sales-support-hub-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "httpx>=0.27,<1",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "pytest-asyncio>=0.24,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
