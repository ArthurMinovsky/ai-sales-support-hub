services:
  api:
    build: ./backend
    ports:
      - target: 8000
        published: "${API_PORT:-0}"
        protocol: tcp
    environment:
      DATABASE_URL: sqlite:////data/app.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/chat/completions}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build: ./web
    ports:
      - target: 3000
        published: "${WEB_PORT:-0}"
        protocol: tcp
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:-}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  app_data:
